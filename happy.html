    <!-- ============================================================
         배경음악 (50초 지점부터 재생)
         ============================================================ -->
    <audio id="myaudio" src="asset/audio/너는꽃이야.mp3" loop preload="auto"></audio>
    <script type="text/javascript">
        (function () {
            var audio = document.getElementById('myaudio');
            var START_AT = 50; // 재생 시작 지점(초)

            // 메타데이터 로드 후 50초 지점으로 이동
            audio.addEventListener('loadedmetadata', function () {
                try { audio.currentTime = START_AT; } catch (e) { }
            });

            function startAudio() {
                if (audio.currentTime < START_AT) {
                    try { audio.currentTime = START_AT; } catch (e) { }
                }
                audio.play().catch(function () { });
            }

            // 자동재생 시도
            window.addEventListener('load', startAudio);

            // 브라우저가 자동재생을 막을 경우, 첫 사용자 동작에서 재생
            ['click', 'touchstart'].forEach(function (ev) {
                document.addEventListener(ev, function handler() {
                    startAudio();
                    document.removeEventListener(ev, handler);
                }, { once: true });
            });
        })();
    </script>

    <script type="text/javascript">
        (function () {
            // 포도원마을 미션하우스 좌표
            var lat = 37.160456,
                lng = 127.610730;

            var container = document.getElementById('map');
            var options = {
                center: new kakao.maps.LatLng(lat, lng),
                level: 3
            };
            var map = new kakao.maps.Map(container, options);

            var markerPosition = new kakao.maps.LatLng(lat, lng);
            var marker = new kakao.maps.Marker({ position: markerPosition });
            marker.setMap(map);

            // 장소명 오버레이
            var content =
                '<div style="padding:6px 10px;background:#1b3a8a;color:#fff;' +
                'border-radius:6px;font-size:13px;font-weight:700;white-space:nowrap;">' +

                'style="color:#fff;text-decoration:none;">포도원마을 미션하우스</a></div>';

            var customOverlay = new kakao.maps.CustomOverlay({
                map: map,
                position: markerPosition,
                content: content,
                yAnchor: 2.2
            });

            // 마커 클릭 시 길찾기 이동
            kakao.maps.event.addListener(marker, 'click', function () {
                window.open('https://kko.to/YejsjdNxgw');
            });
        })();
